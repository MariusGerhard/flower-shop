name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The real Firebase config is git-ignored; tests and build only need the file to exist.
      - name: Create environment.ts from example
        run: cp src/environments/environment.example.ts src/environments/environment.ts

      - name: Unit tests
        run: pnpm ng test --watch=false

      - name: Production build
        run: pnpm ng build
