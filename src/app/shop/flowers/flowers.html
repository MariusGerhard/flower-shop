<section class="col-center gap-md fade-in">
  <h1>{{ t('flowers.title') }}</h1>
  @if (isLoading()) {
    <mat-progress-bar mode="indeterminate" />
  }
  @for (flower of flowers(); track flower.id) {
    <mat-card class="content-card">
      <mat-card-header>
        <mat-card-title>{{ flower.name }}</mat-card-title>
        <mat-card-subtitle>{{ flower.color }}</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <p>{{ t('flowers.price') }} {{ flower.price | currency: 'EUR' : 'symbol' : undefined : i18n.locale() }}</p>
      </mat-card-content>
    </mat-card>
  } @empty {
    @if (!isLoading()) {
      <p>{{ t('flowers.empty') }}</p>
    }
  }
</section>
