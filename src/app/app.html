<mat-sidenav-container class="app-container">
  <mat-sidenav #sidenav role="navigation" mode="over" class="app-sidenav">
    <app-sidenav (closeNav)="sidenav.close()" />
  </mat-sidenav>

  <mat-sidenav-content class="app-content">
    <app-header class="app-header" (toggleNav)="sidenav.toggle()" />
    <main class="app-main">
      <router-outlet />
    </main>
    <app-footer />
  </mat-sidenav-content>
</mat-sidenav-container>
