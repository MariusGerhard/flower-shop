<section class="fade-in">
  <form class="col-center gap-sm" #f="ngForm" (ngSubmit)="onSubmit(f)">
    <h1>{{ t('reset.title') }}</h1>
    @if (isLoading()) {
      <mat-progress-bar mode="indeterminate" />
    }
    <mat-card class="content-card">
      <mat-card-content class="col-center gap-sm">
        <mat-form-field>
          <mat-label>{{ t('reset.email') }}</mat-label>
          <input type="email" matInput ngModel name="email" email required #email="ngModel" autocomplete="email">
          @if (email.hasError('required')) {
            <mat-error>{{ t('common.fieldRequired') }}</mat-error>
          } @else {
            <mat-error>{{ t('common.emailInvalid') }}</mat-error>
          }
        </mat-form-field>
        <button matButton="filled" type="submit" color="accent" [disabled]="f.invalid || isLoading()">{{ t('common.submit') }}</button>
      </mat-card-content>
    </mat-card>
  </form>
</section>
