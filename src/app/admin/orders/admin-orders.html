<section class="col-center">
  <h1>Order History</h1>
  @if (isLoading()) {
    <mat-progress-bar mode="indeterminate" />
  }
  <mat-card>
    <mat-card-content>
      <mat-form-field>
        <mat-label>Filter (bouquet, customer, ...)</mat-label>
        <input matInput (keyup)="applyFilter($event)">
      </mat-form-field>
      <div class="mat-elevation-z2">
        <table mat-table [dataSource]="dataSource" matSort>
          <ng-container matColumnDef="bouquetName">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Bouquet</th>
            <td mat-cell *matCellDef="let row">{{ row.bouquetName }}</td>
          </ng-container>
          <ng-container matColumnDef="userName">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Customer</th>
            <td mat-cell *matCellDef="let row">{{ row.userName }}</td>
          </ng-container>
          <ng-container matColumnDef="pickUpDate">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Pick-up</th>
            <td mat-cell *matCellDef="let row">{{ row.pickUpDate | date }}</td>
          </ng-container>
          <ng-container matColumnDef="price">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Price</th>
            <td mat-cell *matCellDef="let row">{{ row.price | currency: 'EUR' }}</td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell no-data" [attr.colspan]="displayedColumns.length">No orders found.</td>
          </tr>
        </table>
        <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 25]" />
      </div>
    </mat-card-content>
  </mat-card>
</section>
